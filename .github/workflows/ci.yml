name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: [stable]
        include:
          # Minimum supported Rust version (Cargo.toml `rust-version`).
          - os: ubuntu-latest
            toolchain: "1.82"
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust ${{ matrix.toolchain }}
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"

      - name: Test
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Smoke test
        run: |
          out="$(target/release/rxgrep -n Alice examples/sample.xml)"
          expected="$(printf '%s\n' '/catalog/book[1]/author' '/catalog/book[2]/editor' '/catalog/book[3]/note/b')"
          test "$out" = "$expected" || { echo "unexpected output:"; echo "$out"; exit 1; }
